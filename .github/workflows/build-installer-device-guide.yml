name: Build installer device and wiring guide

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_installer_device_guide.py"
      - ".github/workflows/build-installer-device-guide.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installer guide
        run: python3 scripts/build_installer_device_guide.py
      - name: Commit guide
        run: |
          git config user.name "KNX Project Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INSTALLER_DEVICE_WIRING_GUIDE.md INSTALLER_WIRING_SCHEDULE.csv INSTALLER_DEVICE_OVERVIEW.csv
          git diff --cached --quiet && exit 0
          git commit -m "Build installer device and wiring guide"
          git push
