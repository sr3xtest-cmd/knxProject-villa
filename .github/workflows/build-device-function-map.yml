name: Build KNX device function map

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_device_function_map.py"
      - ".github/workflows/build-device-function-map.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build device function map
        run: python3 scripts/build_device_function_map.py
      - name: Commit generated maps
        run: |
          git config user.name "KNX Project Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knx-device-map
          git diff --cached --quiet && exit 0
          git commit -m "Build KNX device function map"
          git push
