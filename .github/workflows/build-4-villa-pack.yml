name: Build 4-villa KNX pack

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-4-villa-pack.yml"
      - "scripts/build_4_villa_pack.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and validate
        run: python3 scripts/build_4_villa_pack.py

      - name: Commit generated pack
        run: |
          git config user.name "KNX Project Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Burooj_4Villas_Pack Burooj_Square_4_Villas_KNX_Pack.zip
          git diff --cached --quiet && exit 0
          git commit -m "Build 4-villa KNX project pack"
          git push
